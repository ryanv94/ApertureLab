  <link rel="manifest" href="manifest.json">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M42 18v10a3 3 0 0 1-.9 2.1L28 44a22 22 0 1 0 44 0L58.9 30.1A3 3 0 0 1 58 28V18' fill='none' stroke='%2306b6d4' stroke-width='6' stroke-linecap='round'/><circle cx='50' cy='58' r='12' fill='%23f59e0b'/></svg>" />
  
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter'] } } } }
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));

  <style>.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }</style>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between overflow-x-auto no-scrollbar">
      <a href="index.html" class="flex items-center gap-3 shrink-0 group mr-8">
        <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700/60 flex items-center justify-center group-hover:border-sky-500/50 group-hover:shadow-[0_0_15px_rgba(14,165,233,0.25)] transition-all">
          <svg class="w-5 h-5 text-cyan-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v3a1 1 0 0 1-.3.7L6.5 9.5a7 7 0 1 0 11 0L14.3 5.7A1 1 0 0 1 14 5V2" /><circle cx="12" cy="14" r="3" class="stroke-amber-400" /></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-base font-bold tracking-tight text-white group-hover:text-cyan-400 transition-colors">Aperture<span class="text-amber-400">Lab</span></span>
          <span class="text-[9px] font-semibold tracking-widest text-slate-400 uppercase -mt-1 hidden sm:block">Studio Suite</span>
        </div>
      </a>
      <nav class="flex items-center gap-1 text-xs font-medium text-slate-300 shrink-0">
        <a href="index.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Home</a>
        <a href="dof-visualizer.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">DoF Visualizer</a>
        <a href="exposure-calculator.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Exposure & ND</a>
        <a href="resize-watermark.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Resize & Watermark</a>
        <a href="exif-frame.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">EXIF Frame</a>
        <a href="panorama-splitter.html" class="px-3 py-2 rounded-lg bg-slate-800 text-sky-400 font-semibold transition">Panorama Splitter</a>
        <a href="color-palette.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Color Palette</a>
        <a href="golden-hour.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Golden Hour</a>
        <a href="print-visualizer.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Print DPI</a>
        <a href="selphy-layout.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Magnet Layout</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 space-y-4">
      <h2 class="text-lg font-bold text-white">Carousel Config</h2>
      <input type="file" id="panoInput" accept="image/*" onchange="splitPano()" class="w-full text-xs text-slate-400 file:bg-slate-700 file:border-0 file:rounded file:px-3 file:py-1 file:text-white">
      <div><label class="text-xs text-slate-400">Target Aspect Ratio</label><select id="aspect" onchange="splitPano()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white"><option value="0.8">IG Portrait (4:5)</option><option value="1.0">IG Square (1:1)</option></select></div>
      <div><label class="text-xs text-slate-400">Number of Slices</label><input type="number" id="slices" min="2" max="10" value="3" onchange="splitPano()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white"></div>
      <button onclick="downloadZip()" class="w-full py-3 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl text-sm transition mt-4">Download All Slices (.ZIP)</button>
    </div>
    <div id="previewContainer" class="lg:col-span-2 bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 flex items-center justify-center gap-2 overflow-x-auto min-h-[300px]">
      <span class="text-xs text-slate-400">Upload a panorama image...</span>
    </div>
  </main>
  <script>
    let panoImg = new Image(), generatedCanvases = [];
    function splitPano() {
      const file = document.getElementById('panoInput').files[0]; if (!file) return;
      const reader = new FileReader(); reader.onload = (e) => { panoImg.src = e.target.result; panoImg.onload = renderSlices; }; reader.readAsDataURL(file);
    }
    function renderSlices() {
      const container = document.getElementById('previewContainer'); container.innerHTML = ''; generatedCanvases = [];
      const numSlices = parseInt(document.getElementById('slices').value);
      const sliceW = panoImg.width / numSlices, sliceH = panoImg.height;
      for(let i=0; i<numSlices; i++) {
        const c = document.createElement('canvas'); c.width = sliceW; c.height = sliceH;
        c.getContext('2d').drawImage(panoImg, i*sliceW, 0, sliceW, sliceH, 0, 0, sliceW, sliceH);
        c.className = "h-48 rounded border border-slate-700 shadow"; container.appendChild(c); generatedCanvases.push(c);
      }
    }
    function downloadZip() {
      if(!generatedCanvases.length) return;
      const zip = new JSZip();
      generatedCanvases.forEach((c, i) => zip.file(`slice_${i+1}.jpg`, c.toDataURL('image/jpeg', 0.95).split(',')[1], {base64: true}));
      zip.generateAsync({type:"blob"}).then(blob => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "carousel.zip"; a.click(); });
    }
  </script>
</body>
</html>

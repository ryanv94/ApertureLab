<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0F17">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M42 18v10a3 3 0 0 1-.9 2.1L28 44a22 22 0 1 0 44 0L58.9 30.1A3 3 0 0 1 58 28V18' fill='none' stroke='%2306b6d4' stroke-width='6' stroke-linecap='round'/><circle cx='50' cy='58' r='12' fill='%23f59e0b'/></svg>" />
  
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter'], mono: ['JetBrains Mono'] } } } }
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  </script>
  <style>.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }</style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between overflow-x-auto no-scrollbar">
      <a href="index.html" class="flex items-center gap-3 shrink-0 group mr-8">
        <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700/60 flex items-center justify-center group-hover:border-amber-400/50 group-hover:shadow-[0_0_15px_rgba(251,191,36,0.25)] transition-all">
          <svg class="w-5 h-5 text-cyan-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v3a1 1 0 0 1-.3.7L6.5 9.5a7 7 0 1 0 11 0L14.3 5.7A1 1 0 0 1 14 5V2" /><circle cx="12" cy="14" r="3" class="stroke-amber-400" /></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-base font-bold tracking-tight text-white group-hover:text-cyan-400 transition-colors">Aperture<span class="text-amber-400">Lab</span></span>
          <span class="text-[9px] font-semibold tracking-widest text-slate-400 uppercase -mt-1 hidden sm:block">Studio Suite</span>
        </div>
      </a>
      
      <nav class="flex items-center gap-1 text-xs font-medium text-slate-300 shrink-0">
        <a href="index.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Home</a>
        <a href="dof-visualizer.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">DoF Visualizer</a>
        <a href="exposure-calculator.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Exposure & ND</a>
        <a href="resize-watermark.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Resize & Watermark</a>
        <a href="exif-frame.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">EXIF Frame</a>
        <a href="panorama-splitter.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Panorama Splitter</a>
        <a href="color-palette.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Color Palette</a>
        <a href="golden-hour.html" class="px-3 py-2 rounded-lg bg-slate-800 text-amber-400 font-semibold transition">Golden Hour</a>
        <a href="print-visualizer.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Print DPI</a>
        <a href="selphy-layout.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Magnet Layout</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-4xl mx-auto w-full p-4 sm:p-6 space-y-6">
    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 text-center space-y-2 relative overflow-hidden">
      <div class="absolute -top-24 -right-24 w-64 h-64 bg-amber-500/10 rounded-full blur-3xl"></div>
      <h2 class="text-2xl font-bold text-white">Solar Ephemeris</h2>
      <p id="locationStatus" class="text-sm text-slate-400">Requesting location data...</p>
      
      <div class="pt-6 grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/50 flex flex-col items-center">
          <div class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Sunrise</div>
          <div id="time-sunrise" class="text-xl font-mono font-bold text-amber-200">--:--</div>
        </div>
        <div class="bg-slate-900/80 p-4 rounded-xl border border-amber-900/30 shadow-[0_0_15px_rgba(245,158,11,0.05)] flex flex-col items-center">
          <div class="text-[10px] text-amber-400 uppercase font-bold tracking-widest mb-1">Golden Hour</div>
          <div id="time-golden" class="text-xl font-mono font-bold text-amber-400">--:--</div>
        </div>
        <div class="bg-slate-900/80 p-4 rounded-xl border border-blue-900/30 shadow-[0_0_15px_rgba(59,130,246,0.05)] flex flex-col items-center">
          <div class="text-[10px] text-blue-400 uppercase font-bold tracking-widest mb-1">Blue Hour</div>
          <div id="time-blue" class="text-xl font-mono font-bold text-blue-400">--:--</div>
        </div>
        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/50 flex flex-col items-center">
          <div class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-1">Sunset</div>
          <div id="time-sunset" class="text-xl font-mono font-bold text-rose-300">--:--</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function formatTime(dateObj) {
      if (!dateObj || isNaN(dateObj)) return "--:--";
      return dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function calculateEphemeris(lat, lng, locName) {
      document.getElementById('locationStatus').innerText = `Tracking solar cycles for: ${locName}`;
      const times = SunCalc.getTimes(new Date(), lat, lng);
      
      document.getElementById('time-sunrise').innerText = formatTime(times.sunrise);
      document.getElementById('time-sunset').innerText = formatTime(times.sunset);
      document.getElementById('time-golden').innerText = formatTime(times.goldenHour);
      document.getElementById('time-blue').innerText = formatTime(times.sunset); 
    }

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => calculateEphemeris(pos.coords.latitude, pos.coords.longitude, "Your Local Coordinates"),
        (err) => calculateEphemeris(53.3498, -6.2603, "Dublin, Ireland (Default)"),
        { timeout: 5000 }
      );
    } else {
      calculateEphemeris(53.3498, -6.2603, "Dublin, Ireland (Default)");
    }
  </script>
</body>
</html>

<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0F17">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M42 18v10a3 3 0 0 1-.9 2.1L28 44a22 22 0 1 0 44 0L58.9 30.1A3 3 0 0 1 58 28V18' fill='none' stroke='%2306b6d4' stroke-width='6' stroke-linecap='round'/><circle cx='50' cy='58' r='12' fill='%23f59e0b'/></svg>" />
  
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter'] } } } }
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  </script>
  <style>.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }</style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between overflow-x-auto no-scrollbar">
      <a href="index.html" class="flex items-center gap-3 shrink-0 group mr-8">
        <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700/60 flex items-center justify-center group-hover:border-emerald-500/50 group-hover:shadow-[0_0_15px_rgba(16,185,129,0.25)] transition-all">
          <svg class="w-5 h-5 text-cyan-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v3a1 1 0 0 1-.3.7L6.5 9.5a7 7 0 1 0 11 0L14.3 5.7A1 1 0 0 1 14 5V2" /><circle cx="12" cy="14" r="3" class="stroke-amber-400" /></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-base font-bold tracking-tight text-white group-hover:text-cyan-400 transition-colors">Aperture<span class="text-amber-400">Lab</span></span>
          <span class="text-[9px] font-semibold tracking-widest text-slate-400 uppercase -mt-1 hidden sm:block">Studio Suite</span>
        </div>
      </a>
      <nav class="flex items-center gap-1 text-xs font-medium text-slate-300 shrink-0">
        <a href="index.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Home</a>
        <a href="dof-visualizer.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">DoF Visualizer</a>
        <a href="exposure-calculator.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Exposure & ND</a>
        <a href="resize-watermark.html" class="px-3 py-2 rounded-lg bg-slate-800 text-emerald-400 font-semibold transition">Resize & Watermark</a>
        <a href="exif-frame.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">EXIF Frame</a>
        <a href="panorama-splitter.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Panorama Splitter</a>
        <a href="color-palette.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Color Palette</a>
        <a href="golden-hour.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Golden Hour</a>
        <a href="print-visualizer.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Print DPI</a>
        <a href="selphy-layout.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Magnet Layout</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 space-y-5">
      <h2 class="text-lg font-bold text-white">Image Setup</h2>
      <input type="file" id="imgInput" accept="image/*" onchange="processImg()" class="w-full text-xs text-slate-400 file:bg-slate-700 file:border-0 file:rounded file:px-3 file:py-1.5 file:text-white cursor-pointer">
      <div><label class="text-xs text-slate-400 font-semibold mb-1 block">Aspect Ratio & Crop</label><select id="aspectRatio" onchange="processImg()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white"><option value="free">Original</option><option value="1">Square (1:1)</option><option value="0.8">IG (4:5)</option></select></div>
      <div><label class="text-xs text-slate-400 font-semibold mb-1 block">Target Width (px)</label><input type="number" id="customWidth" value="1080" onchange="processImg()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white"></div>
      <div class="pt-4 border-t border-slate-700/80"><label class="text-xs text-slate-400 font-semibold mb-1 block">Watermark Text</label><input type="text" id="wmText" placeholder="© 2026 Your Name" oninput="processImg()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white"></div>
      <button onclick="downloadImg()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-sm transition">Download Processed Image</button>
    </div>
    <div class="md:col-span-2 bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 flex flex-col items-center justify-center min-h-[400px]">
      <canvas id="outCanvas" class="max-w-full max-h-[600px] rounded shadow-lg bg-slate-900 hidden"></canvas>
      <div id="placeholder" class="text-slate-500 text-sm">Upload an image to preview results.</div>
    </div>
  </main>
  <script>
    let img = new Image();
    function processImg() {
      const file = document.getElementById('imgInput').files[0];
      if (file && !img.src) { const r = new FileReader(); r.onload = (e) => { img.src = e.target.result; img.onload = render; }; r.readAsDataURL(file); } else { render(); }
    }
    function render() {
      if(!img.src) return;
      document.getElementById('outCanvas').classList.remove('hidden'); document.getElementById('placeholder').classList.add('hidden');
      const canvas = document.getElementById('outCanvas'), ctx = canvas.getContext('2d');
      const targetW = parseInt(document.getElementById('customWidth').value) || img.width;
      const aspectSel = document.getElementById('aspectRatio').value;
      let targetH = targetW / (img.width / img.height), sx = 0, sy = 0, sWidth = img.width, sHeight = img.height;
      if (aspectSel !== 'free') {
        const targetAspect = parseFloat(aspectSel), sourceAspect = img.width / img.height;
        targetH = targetW / targetAspect;
        if (sourceAspect > targetAspect) { sHeight = img.height; sWidth = img.height * targetAspect; sx = (img.width - sWidth) / 2; } 
        else { sWidth = img.width; sHeight = img.width / targetAspect; sy = (img.height - sHeight) / 2; }
      }
      canvas.width = targetW; canvas.height = targetH;
      ctx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, targetW, targetH);
      const txt = document.getElementById('wmText').value;
      if (txt) { ctx.font = 'bold ' + (targetW * 0.025) + 'px sans-serif'; ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fillText(txt, targetW * 0.03, targetH * 0.96); }
    }
    function downloadImg() { if(img.src){ const a = document.createElement('a'); a.download = 'resized.jpg'; a.href = document.getElementById('outCanvas').toDataURL('image/jpeg', 0.95); a.click(); } }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depth of Field Visualizer — ApertureLab</title>
  
  <!-- New Relic Browser Monitoring -->
  <script src="nr.js"></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0F17">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M42 18v10a3 3 0 0 1-.9 2.1L28 44a22 22 0 1 0 44 0L58.9 30.1A3 3 0 0 1 58 28V18' fill='none' stroke='%2306b6d4' stroke-width='6' stroke-linecap='round'/><circle cx='50' cy='58' r='12' fill='%23f59e0b'/></svg>" />
  
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter'], mono: ['JetBrains Mono'] } } } }
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  </script>
  <style>.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }</style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between overflow-x-auto no-scrollbar">
      <a href="index.html" class="flex items-center gap-3 shrink-0 group mr-8">
        <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700/60 flex items-center justify-center group-hover:border-cyan-500/50 group-hover:shadow-[0_0_15px_rgba(6,182,212,0.25)] transition-all">
          <svg class="w-5 h-5 text-cyan-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v3a1 1 0 0 1-.3.7L6.5 9.5a7 7 0 1 0 11 0L14.3 5.7A1 1 0 0 1 14 5V2" /><circle cx="12" cy="14" r="3" class="stroke-amber-400" /></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-base font-bold tracking-tight text-white group-hover:text-cyan-400 transition-colors">Aperture<span class="text-amber-400">Lab</span></span>
          <span class="text-[9px] font-semibold tracking-widest text-slate-400 uppercase -mt-1 hidden sm:block">Studio Suite</span>
        </div>
      </a>
      <nav class="flex items-center gap-1 text-xs font-medium text-slate-300 shrink-0">
        <a href="index.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Home</a>
        <a href="dof-visualizer.html" class="px-3 py-2 rounded-lg bg-slate-800 text-cyan-400 font-semibold transition">DoF Visualizer</a>
        <a href="exposure-calculator.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Exposure & ND</a>
        <a href="resize-watermark.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Resize & Watermark</a>
        <a href="exif-frame.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">EXIF Frame</a>
        <a href="panorama-splitter.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Panorama Splitter</a>
        <a href="color-palette.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Color Palette</a>
        <a href="golden-hour.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Golden Hour</a>
        <a href="print-visualizer.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Print DPI</a>
        <a href="selphy-layout.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Magnet Layout</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 space-y-4">
      <h2 class="text-lg font-bold text-white">Optics Parameters</h2>
      <div>
        <label class="text-xs font-semibold text-slate-400">Sensor Format</label>
        <select id="sensor" onchange="calcDoF()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white"><option value="1.0">Full Frame (35mm)</option><option value="1.5">APS-C (Nikon/Sony/Fuji)</option><option value="2.0">Micro Four Thirds</option></select>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400">Focal Length: <span id="focalVal" class="text-cyan-400">50mm</span></label>
        <input type="range" id="focal" min="12" max="400" value="50" oninput="calcDoF()" class="w-full accent-cyan-500 mt-1">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400">Aperture: <span id="apertureVal" class="text-cyan-400">f/2.8</span></label>
        <input type="range" id="aperture" min="0" max="15" value="4" step="1" oninput="calcDoF()" class="w-full accent-cyan-500 mt-1">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400">Subject Distance: <span id="distVal" class="text-cyan-400">3.0m</span></label>
        <input type="range" id="distance" min="0.5" max="30" value="3.0" step="0.1" oninput="calcDoF()" class="w-full accent-cyan-500 mt-1">
      </div>
    </div>
    <div class="lg:col-span-2 bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 flex flex-col justify-between">
      <div>
        <h2 class="text-lg font-bold text-white mb-2">Depth Field Diagram</h2>
        <div class="w-full h-64 bg-slate-950 rounded-xl border border-slate-800 relative overflow-hidden flex items-center px-8">
          <svg id="svgDiagram" class="w-full h-full" viewBox="0 0 600 200"></svg>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-6">
        <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800"><div class="text-[10px] text-slate-400 uppercase font-mono">Hyperfocal</div><div id="hyperfocal" class="text-base font-bold text-cyan-400 font-mono mt-1">--</div></div>
        <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800"><div class="text-[10px] text-slate-400 uppercase font-mono">Near Limit</div><div id="nearLimit" class="text-base font-bold text-emerald-400 font-mono mt-1">--</div></div>
        <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800"><div class="text-[10px] text-slate-400 uppercase font-mono">Far Limit</div><div id="farLimit" class="text-base font-bold text-emerald-400 font-mono mt-1">--</div></div>
        <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800"><div class="text-[10px] text-slate-400 uppercase font-mono">Total Depth</div><div id="totalDof" class="text-base font-bold text-amber-400 font-mono mt-1">--</div></div>
      </div>
    </div>
  </main>
  <script>
    const apertures = [1.2, 1.4, 1.8, 2.0, 2.8, 4.0, 5.6, 8.0, 11.0, 16.0, 22.0, 32.0];
    function calcDoF() {
      const crop = parseFloat(document.getElementById('sensor').value);
      const f = parseFloat(document.getElementById('focal').value);
      const N = apertures[parseInt(document.getElementById('aperture').value)];
      const d = parseFloat(document.getElementById('distance').value) * 1000;
      const coc = 0.030 / crop;
      document.getElementById('focalVal').innerText = f + 'mm';
      document.getElementById('apertureVal').innerText = 'f/' + N;
      document.getElementById('distVal').innerText = (d/1000).toFixed(1) + 'm';
      const H = (f * f) / (N * coc) + f;
      const Dn = (H * d) / (H + (d - f));
      const Df = (d < H) ? (H * d) / (H - (d - f)) : Infinity;
      const dof = (Df === Infinity) ? Infinity : Df - Dn;
      document.getElementById('hyperfocal').innerText = (H/1000).toFixed(2) + 'm';
      document.getElementById('nearLimit').innerText = (Dn/1000).toFixed(2) + 'm';
      document.getElementById('farLimit').innerText = (Df === Infinity) ? '∞' : (Df/1000).toFixed(2) + 'm';
      document.getElementById('totalDof').innerText = (dof === Infinity) ? 'Infinite' : (dof/1000).toFixed(2) + 'm';
      const svg = document.getElementById('svgDiagram');
      const nearX = Math.min(Math.max((Dn / (H * 0.5)) * 500 + 50, 60), 540);
      const farX = (Df === Infinity) ? 580 : Math.min((Df / (H * 0.5)) * 500 + 50, 580);
      const subjX = Math.min((d / (H * 0.5)) * 500 + 50, 550);
      svg.innerHTML = `<line x1="20" y1="100" x2="580" y2="100" stroke="#334155" stroke-width="2"/><rect x="${nearX}" y="40" width="${Math.max(farX - nearX, 5)}" height="120" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="2" rx="4"/><circle cx="${subjX}" cy="100" r="8" fill="#f59e0b"/><text x="${subjX}" y="75" fill="#f59e0b" font-size="10" text-anchor="middle" font-family="monospace">Subject</text>`;
    }
    calcDoF();
  </script>
</body>
</html>

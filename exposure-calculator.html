<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exposure & ND Calculator — ApertureLab</title>
  
  <!-- New Relic Browser Monitoring -->
  <script src="nr.js"></script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0F17">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><path d='M42 18v10a3 3 0 0 1-.9 2.1L28 44a22 22 0 1 0 44 0L58.9 30.1A3 3 0 0 1 58 28V18' fill='none' stroke='%2306b6d4' stroke-width='6' stroke-linecap='round'/><circle cx='50' cy='58' r='12' fill='%23f59e0b'/></svg>" />
  
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter'], mono: ['JetBrains Mono'] } } } }
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  </script>
  <style>.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }</style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between overflow-x-auto no-scrollbar">
      <a href="index.html" class="flex items-center gap-3 shrink-0 group mr-8">
        <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700/60 flex items-center justify-center group-hover:border-amber-500/50 group-hover:shadow-[0_0_15px_rgba(245,158,11,0.25)] transition-all">
          <svg class="w-5 h-5 text-cyan-400 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v3a1 1 0 0 1-.3.7L6.5 9.5a7 7 0 1 0 11 0L14.3 5.7A1 1 0 0 1 14 5V2" /><circle cx="12" cy="14" r="3" class="stroke-amber-400" /></svg>
        </div>
        <div class="flex flex-col">
          <span class="text-base font-bold tracking-tight text-white group-hover:text-cyan-400 transition-colors">Aperture<span class="text-amber-400">Lab</span></span>
          <span class="text-[9px] font-semibold tracking-widest text-slate-400 uppercase -mt-1 hidden sm:block">Studio Suite</span>
        </div>
      </a>
      <nav class="flex items-center gap-1 text-xs font-medium text-slate-300 shrink-0">
        <a href="index.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Home</a>
        <a href="dof-visualizer.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">DoF Visualizer</a>
        <a href="exposure-calculator.html" class="px-3 py-2 rounded-lg bg-slate-800 text-amber-400 font-semibold transition">Exposure & ND</a>
        <a href="resize-watermark.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Resize & Watermark</a>
        <a href="exif-frame.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">EXIF Frame</a>
        <a href="panorama-splitter.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Panorama Splitter</a>
        <a href="color-palette.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Color Palette</a>
        <a href="golden-hour.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Golden Hour</a>
        <a href="print-visualizer.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Print DPI</a>
        <a href="selphy-layout.html" class="px-3 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition">Magnet Layout</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-5xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 space-y-4">
      <h2 class="text-lg font-bold text-white flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-slate-400"></span> 1. Base Exposure</h2>
      <div><label class="text-xs text-slate-400 font-semibold">Metered Shutter Speed</label><select id="baseShutter" onchange="calcExposure()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white"></select></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-xs text-slate-400 font-semibold">Metered Aperture</label><select id="baseAperture" onchange="calcExposure()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white"></select></div>
        <div><label class="text-xs text-slate-400 font-semibold">Metered ISO</label><select id="baseIso" onchange="calcExposure()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white"></select></div>
      </div>
      <div class="pt-2 text-xs text-slate-500 font-mono">Base EV (ISO 100): <span id="baseEvOutput" class="text-slate-300">--</span></div>
    </div>
    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 space-y-4">
      <h2 class="text-lg font-bold text-white flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber-400"></span> 2. Filters & Targets</h2>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-xs text-amber-400 font-semibold">ND Filter</label><select id="ndStops" onchange="calcExposure()" class="w-full mt-1 bg-slate-900 border border-amber-900/50 rounded-lg p-2 text-sm text-white"><option value="0">None</option><option value="3">ND8 (3 Stops)</option><option value="6">ND64 (6 Stops)</option><option value="10" selected>ND1000 (10 Stops)</option><option value="15">ND32000 (15 Stops)</option></select></div>
        <div><label class="text-xs text-amber-400 font-semibold">CPL Filter</label><select id="cplStops" onchange="calcExposure()" class="w-full mt-1 bg-slate-900 border border-amber-900/50 rounded-lg p-2 text-sm text-white"><option value="0">None</option><option value="1.5">1.5 Stops Loss</option></select></div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-xs text-slate-400 font-semibold">Target Aperture</label><select id="targetAperture" onchange="calcExposure()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white"></select></div>
        <div><label class="text-xs text-slate-400 font-semibold">Target ISO</label><select id="targetIso" onchange="calcExposure()" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white"></select></div>
      </div>
    </div>
    <div class="md:col-span-2 bg-slate-800/60 border border-slate-700/80 rounded-2xl p-8 text-center space-y-4">
      <div class="text-xs uppercase font-mono text-slate-400 tracking-wider">Calculated Shutter Speed</div>
      <div id="targetTime" class="text-5xl sm:text-7xl font-extrabold text-amber-400 font-mono tracking-tighter">--</div>
      <div class="mt-4 flex justify-center">
        <button onclick="toggleTimer()" id="timerBtn" class="px-8 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition text-sm">Start Bulb Timer</button>
      </div>
    </div>
  </main>
  <script>
    const shutterSpeeds = [1/8000, 1/4000, 1/2000, 1/1000, 1/500, 1/250, 1/125, 1/60, 1/30, 1/15, 1/8, 1/4, 0.5, 1];
    const apertures = [1.4, 2, 2.8, 4, 5.6, 8, 11, 16, 22];
    const isos = [50, 100, 200, 400, 800, 1600, 3200];
    function populateSelect(id, arr, fn, def) { const el = document.getElementById(id); arr.forEach((v, i) => { const opt = document.createElement('option'); opt.value = v; opt.innerText = fn?fn(v):v; if(i===def) opt.selected=true; el.appendChild(opt); }); }
    populateSelect('baseShutter', shutterSpeeds, v=>v<1?`1/${Math.round(1/v)}s`:`${v}s`, 5);
    populateSelect('baseAperture', apertures, v=>`f/${v}`, 2);
    populateSelect('baseIso', isos, v=>`ISO ${v}`, 1);
    populateSelect('targetAperture', apertures, v=>`f/${v}`, 2);
    populateSelect('targetIso', isos, v=>`ISO ${v}`, 1);
    
    let targetSec = 0, timerId = null;
    function calcExposure() {
      const bT = parseFloat(document.getElementById('baseShutter').value), bA = parseFloat(document.getElementById('baseAperture').value), bIso = parseFloat(document.getElementById('baseIso').value);
      const tA = parseFloat(document.getElementById('targetAperture').value), tIso = parseFloat(document.getElementById('targetIso').value);
      document.getElementById('baseEvOutput').innerText = (Math.log2((bA*bA)/bT) - Math.log2(bIso/100)).toFixed(1) + " EV";
      targetSec = bT * Math.pow(2, parseFloat(document.getElementById('ndStops').value) + parseFloat(document.getElementById('cplStops').value) + (Math.log2(tA*tA) - Math.log2(bA*bA)) + Math.log2(bIso/tIso));
      document.getElementById('targetTime').innerText = targetSec < 1 ? `1/${Math.round(1/targetSec)}s` : `${Math.round(targetSec)}s`;
    }
    function toggleTimer() {
      if (timerId) { clearInterval(timerId); timerId = null; document.getElementById('timerBtn').innerText = "Start Bulb Timer"; calcExposure(); return; }
      if (targetSec < 1) { alert("Use camera shutter. Timer is for bulb mode (>1s)."); return; }
      let left = Math.round(targetSec); document.getElementById('timerBtn').innerText = "Stop Timer";
      timerId = setInterval(() => { left--; document.getElementById('targetTime').innerText = `${left}s`; if(left<=0){ clearInterval(timerId); timerId=null; alert("Complete!"); calcExposure(); } }, 1000);
    }
    calcExposure();
  </script>
</body>
</html>
